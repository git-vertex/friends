<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Arena</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">
  <main class="shell">

    <section class="topbar">

      <div class="player-card">
        <span class="dot blue"></span>

        <div>
          <div class="name">YOU</div>
          <div class="label">
            HP <span id="p1HpText">100</span>
          </div>

          <div class="health">
            <div id="p1Health"></div>
          </div>
        </div>
      </div>

      <div class="timer">
        <div id="time">30.0</div>
        <div id="status">ROUND 1</div>
      </div>

      <div class="player-card right">

        <div>
          <div class="name">BOT</div>

          <div class="label">
            HP <span id="p2HpText">100</span>
          </div>

          <div class="health">
            <div id="p2Health"></div>
          </div>
        </div>

        <span class="dot red"></span>

      </div>

    </section>

    <section class="arena-wrap">

      <canvas
        id="game"
        width="960"
        height="540"
      ></canvas>

      <div class="overlay" id="overlay">

        <div class="result">

          <h1 id="resultTitle">TIME</h1>

          <p id="resultText">
            Раунд завершён
          </p>

          <button id="restart">
            Новый раунд
          </button>

        </div>

      </div>

    </section>

    <div class="hint">

      <div>
        <span class="kbd">WASD</span>
        движение · мышь — прицел ·
        <span class="kbd">ЛКМ</span>
        стрелять
      </div>

      <div>
        Выстрел: 1с · Хук: 2с · Раунд: 30с
      </div>

    </div>

  </main>
</div>

<script src="game.js"></script>

</body>
</html>
