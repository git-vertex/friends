<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1v1</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08090d;
            color: white;
            font-family: Arial, sans-serif;
        }

        #menu {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel {
            width: 360px;
            padding: 30px;
            background: #11131a;
            border: 1px solid #292d38;
            border-radius: 14px;
        }

        h1 {
            margin: 0 0 24px;
            text-align: center;
        }

        input {
            width: 100%;
            height: 46px;
            margin-bottom: 10px;
            padding: 0 14px;
            border: 1px solid #303542;
            border-radius: 8px;
            outline: none;
            background: #090b10;
            color: white;
            font-size: 16px;
            text-transform: uppercase;
        }

        button {
            width: 100%;
            height: 46px;
            margin-bottom: 10px;
            border: 0;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6975ff;
        }

        #status {
            min-height: 20px;
            margin-top: 8px;
            text-align: center;
            color: #999eac;
            font-size: 14px;
        }

        #game {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #roomInfo {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            border: 1px solid #303542;
            border-radius: 8px;
            background: rgba(10, 12, 18, .9);
            z-index: 5;
        }

        #hud {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 5;
        }

        .hp {
            width: 220px;
            height: 18px;
            background: #252832;
            border-radius: 5px;
            overflow: hidden;
        }

        #hpFill {
            width: 100%;
            height: 100%;
            background: #43df70;
        }

        #controls {
            margin-top: 8px;
            color: #a5aab8;
            font-size: 13px;
        }

        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: bold;
            pointer-events: none;
            z-index: 6;
        }
    </style>
</head>
<body>

<div id="menu">
    <div class="panel">
        <h1>1v1</h1>

        <input id="roomInput" maxlength="6" placeholder="ROOM CODE">

        <button id="createBtn">CREATE ROOM</button>
        <button id="joinBtn">JOIN ROOM</button>

        <div id="status"></div>
    </div>
</div>

<div id="game">

    <div id="roomInfo">
        ROOM: <span id="roomCode"></span>
    </div>

    <div id="hud">
        <div class="hp">
            <div id="hpFill"></div>
        </div>

        <div id="controls">
            WASD / Arrows — move<br>
            Left Mouse — attack
        </div>
    </div>

    <div id="message"></div>

    <canvas id="canvas"></canvas>
</div>

<script type="module" src="./game.js"></script>

</body>
</html>
