<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Duel Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby">
    <div class="lobby-panel">
        <div class="logo">DUEL ARENA</div>
        <div class="subtitle">REAL-TIME 1V1</div>

        <button id="createRoom" class="primary">
            СОЗДАТЬ КОМНАТУ
        </button>

        <div id="createdRoom" class="created-room hidden">
            <div class="room-label">КОД КОМНАТЫ</div>

            <div class="room-code-row">
                <strong id="roomCode">------</strong>
                <button id="copyCode" class="copy-button">
                    COPY
                </button>
            </div>

            <div id="waitingText" class="waiting">
                Ждём второго игрока...
            </div>
        </div>

        <div class="separator">
            <span>ИЛИ</span>
        </div>

        <input
            id="joinCode"
            type="text"
            maxlength="6"
            placeholder="ВВЕДИ КОД"
            autocomplete="off"
            spellcheck="false"
        >

        <button id="joinRoom">
            ВОЙТИ В КОМНАТУ
        </button>

        <div class="separator">
            <span>ИЛИ</span>
        </div>

        <button id="playBot" class="secondary">
            ИГРАТЬ С BOT
        </button>

        <div id="lobbyStatus"></div>
    </div>
</div>

<div id="app">

    <main class="shell">

        <section class="topbar">

            <div class="player-card">
                <span class="dot blue"></span>

                <div class="player-info">
                    <div class="name">YOU</div>

                    <div class="label">
                        HP
                        <span id="p1HpText">100</span>
                    </div>

                    <div class="health">
                        <div id="p1Health"></div>
                    </div>
                </div>
            </div>

            <div class="timer">
                <div id="time">30.0</div>
                <div id="status">WAITING</div>
            </div>

            <div class="player-card right">

                <div class="player-info">
                    <div class="name" id="enemyName">
                        OPPONENT
                    </div>

                    <div class="label">
                        HP
                        <span id="p2HpText">100</span>
                    </div>

                    <div class="health">
                        <div id="p2Health"></div>
                    </div>
                </div>

                <span class="dot red"></span>

            </div>

        </section>

        <section class="arena-wrap">

            <canvas
                id="game"
                width="960"
                height="540"
            ></canvas>

            <div id="overlay" class="overlay">

                <div class="result">

                    <div class="result-small">
                        ROUND RESULT
                    </div>

                    <h1 id="resultTitle">
                        YOU WIN
                    </h1>

                    <p id="resultText">
                        Раунд завершён
                    </p>

                    <button id="restart" class="primary">
                        НОВЫЙ РАУНД
                    </button>

                    <button id="backToLobby">
                        В МЕНЮ
                    </button>

                </div>

            </div>

        </section>

        <div class="hint">
            <div>
                <span class="kbd">WASD</span>
                движение
                <span class="separator-dot">·</span>
                мышь — прицел
                <span class="separator-dot">·</span>
                <span class="kbd">ЛКМ</span>
                стрелять
                <span class="separator-dot">·</span>
                <span class="kbd">ПКМ</span>
                хук
            </div>

            <div>
                Выстрел: 1с
                <span class="separator-dot">·</span>
                Хук: 2с
                <span class="separator-dot">·</span>
                Раунд: 30с
            </div>
        </div>

    </main>

</div>

<script type="module" src="game.js"></script>

</body>
</html>
