<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Arena</title>

<style>
:root{
color-scheme:dark;
--bg:#090b10;
--panel:#11151d;
--panel-2:#171c25;
--line:#2a3341;
--text:#eef2f7;
--muted:#97a2b1;
--blue:#67a7ff;
--blue-2:#2d6cdf;
--red:#ff6d7f;
--red-2:#d83f55;
}

*{box-sizing:border-box}

html,body{
width:100%;
height:100%;
margin:0;
}

body{
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
overflow:hidden;
}

button,input{
font:inherit;
}

#lobby{
position:fixed;
inset:0;
z-index:10000;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:#090b10;
}

.lobby-panel{
width:min(430px,100%);
padding:30px;
border:1px solid var(--line);
border-radius:18px;
background:var(--panel);
box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.logo{
text-align:center;
font-size:32px;
font-weight:950;
letter-spacing:.04em;
}

.subtitle{
text-align:center;
color:var(--muted);
font-size:11px;
letter-spacing:.2em;
margin-top:5px;
margin-bottom:28px;
}

.lobby-panel button{
width:100%;
margin-top:10px;
}

.lobby-panel input{
width:100%;
padding:13px 14px;
border:1px solid #374457;
border-radius:10px;
background:#0c1118;
color:white;
outline:none;
text-align:center;
font-size:18px;
font-weight:800;
letter-spacing:.15em;
}

.lobby-panel input:focus{
border-color:#6689bd;
}

.primary{
background:#245dbd!important;
border-color:#3774df!important;
}

.primary:hover{
background:#2e6dd4!important;
}

.secondary{
background:#171e29;
}

.created-room{
margin-top:16px;
padding:15px;
border:1px solid #303b4d;
border-radius:12px;
background:#0d121a;
}

.hidden{
display:none!important;
}

.room-label{
font-size:10px;
letter-spacing:.15em;
color:var(--muted);
text-align:center;
}

.room-code-row{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
margin-top:5px;
}

.room-code-row strong{
font-size:30px;
letter-spacing:.16em;
}

.copy-button{
width:auto!important;
margin:0!important;
padding:7px 10px!important;
font-size:11px!important;
}

.waiting{
text-align:center;
color:var(--muted);
font-size:12px;
margin-top:10px;
}

.separator{
display:flex;
align-items:center;
gap:10px;
margin:18px 0;
color:#596576;
font-size:11px;
}

.separator:before,
.separator:after{
content:"";
height:1px;
flex:1;
background:#252e3b;
}

#lobbyStatus{
min-height:20px;
text-align:center;
color:#ff8c9b;
font-size:12px;
margin-top:14px;
}

#app{
min-height:100vh;
width:100%;
background:#090b10;
color:#eef2f7;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.shell{
width:min(1100px,100%);
display:grid;
gap:12px;
}

.topbar{
display:grid;
grid-template-columns:1fr auto 1fr;
align-items:center;
min-height:72px;
padding:12px 14px;
border:1px solid var(--line);
border-radius:14px;
background:var(--panel);
box-shadow:0 16px 40px rgba(0,0,0,.26);
}

.player-card{
display:flex;
align-items:center;
gap:10px;
min-width:0;
}

.player-card.right{
justify-content:flex-end;
text-align:right;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
flex:none;
box-shadow:0 0 16px currentColor;
}

.dot.blue{
color:var(--blue);
background:var(--blue);
}

.dot.red{
color:var(--red);
background:var(--red);
}

.label{
font-size:13px;
color:var(--muted);
}

.name{
font-weight:800;
letter-spacing:.02em;
}

.health{
width:clamp(110px,18vw,180px);
height:8px;
border-radius:999px;
overflow:hidden;
background:#222834;
margin-top:5px;
}

.health>div{
height:100%;
width:100%;
transition:width .12s linear;
}

#p1Health{
background:linear-gradient(90deg,var(--blue-2),var(--blue));
}

#p2Health{
background:linear-gradient(90deg,var(--red-2),var(--red));
}

.timer{
min-width:122px;
text-align:center;
font-variant-numeric:tabular-nums;
}

#time{
font-size:30px;
font-weight:900;
line-height:1;
}

#status{
color:var(--muted);
font-size:11px;
text-transform:uppercase;
letter-spacing:.16em;
margin-top:6px;
}

.arena-wrap{
position:relative;
border:1px solid var(--line);
border-radius:16px;
overflow:hidden;
background:#0d1118;
box-shadow:0 20px 60px rgba(0,0,0,.34);
}

canvas{
width:100%;
display:block;
aspect-ratio:16/9;
cursor:crosshair;
}

.overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(5,7,11,.58);
backdrop-filter:blur(4px);
opacity:0;
pointer-events:none;
transition:opacity .18s ease;
}

.overlay.show{
opacity:1;
pointer-events:auto;
}

.result{
width:min(340px,calc(100% - 28px));
border:1px solid #303a4a;
border-radius:16px;
padding:22px;
text-align:center;
background:#11161f;
box-shadow:0 22px 60px rgba(0,0,0,.42);
}

.result h1{
margin:0 0 7px;
font-size:30px;
}

.result p{
margin:0 0 17px;
color:var(--muted);
}

button{
border:1px solid #374457;
background:#1a2230;
color:var(--text);
border-radius:10px;
padding:11px 18px;
font:inherit;
font-weight:800;
cursor:pointer;
}

button:hover{
background:#222d3d;
}

.result button{
width:100%;
margin-top:8px;
}

.hint{
display:flex;
justify-content:space-between;
align-items:center;
gap:14px;
color:var(--muted);
font-size:12px;
padding:0 4px;
}

.kbd{
display:inline-block;
min-width:24px;
padding:2px 6px;
margin:0 1px;
border:1px solid #334052;
border-bottom-width:2px;
border-radius:5px;
background:#141a23;
color:#dbe3ee;
text-align:center;
}

#bonusOverlay{
position:fixed;
inset:0;
z-index:9999;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
background:rgba(5,7,11,.76);
backdrop-filter:blur(7px);
}

#bonusPanel{
width:min(760px,calc(100vw - 28px));
border:1px solid #303a4a;
border-radius:18px;
padding:22px;
background:#11161f;
box-shadow:0 24px 70px rgba(0,0,0,.52);
}

#bonusTitle{
margin:0;
text-align:center;
font-size:25px;
font-weight:900;
}

#bonusSubtitle{
margin:6px 0 18px;
text-align:center;
color:#97a2b1;
font-size:13px;
}

#bonusCards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.bonusCard{
min-height:175px;
padding:16px;
border:1px solid #334052;
border-radius:14px;
background:#171d27;
color:#eef2f7;
text-align:left;
cursor:pointer;
font:inherit;
transition:transform .14s ease,border-color .14s ease,background .14s ease;
}

.bonusCard:hover{
transform:translateY(-4px);
border-color:#6b7f9d;
background:#1d2633;
}

.bonusIcon{
width:44px;
height:44px;
display:flex;
align-items:center;
justify-content:center;
border-radius:12px;
background:#202a38;
font-size:23px;
margin-bottom:13px;
}

.bonusName{
font-size:16px;
font-weight:900;
margin-bottom:7px;
}

.bonusDesc{
color:#97a2b1;
font-size:12px;
line-height:1.5;
}

@media(max-width:720px){
#app{padding:10px}
.topbar{padding:10px}
#time{font-size:25px}
.name{font-size:13px}
.label{font-size:11px}
.health{width:100px}
.hint{font-size:11px}
#bonusCards{grid-template-columns:1fr}
.bonusCard{min-height:0}
}
</style>
</head>

let state;

null;

null;

false;

false;

0;

let remoteInput = {
keys:[],
mouseX:W/2,

shoot:false,
hook:false
};


const clamp =
(v,a,b)=>
Math.max(
a,
Math.min(
b,
v
)
);

const len =
(x,y)=>
Math.hypot(
x,y
);

const dist =
(a,b)=>
Math.hypot(
a.x-b.x,
a.y-b.y
);


function makePlayer(
x,
y,
color,
dir
){

return {

x,
y,
r:17,
hp:100,
color,
dir,
speed:215,
cooldown:0,
hurt:0,
recoil:0,
hookVx:0,
hookVy:0

};

function reset(){

state={

running:true,

time:30,

bullets:[],

particles:[],

flash:0,

hook:{

active:false,

mode:null,

x:0,
y:0,
age:0,
life:.62,

startX:0,
startY:0,

endX:0,
endY:0,

bend:[],
power:0,

restLength:240

},

hookCooldown:0,

aiStrafe:1,

p1:makePlayer(
130,
H/2,
"#67a7ff",
1
),

p2:makePlayer(

-1
)

};

statusEl.textContent =
gameMode==="bot"
?"ROUND "+round
:"WAITING";

}


function arenaBounds(p){

p.x=
clamp(
p.x,
42+p.r,
W-42-p.r
);

p.y=
clamp(
p.y,
42+p.r,
H-42-p.r
);

}


function canShoot(p){

return(
p.cooldown<=0 &&
state.running &&
p.hp>0
);

}


function rayCircleDistance(
x,y,dx,dy,cx,cy,r
){

const ox=x-cx;
const oy=y-cy;

const b=
ox*dx+
oy*dy;

const c=
ox*ox+
oy*oy-
r*r;

const h=
b*b-c;

if(h<0)
return Infinity;

const s=
Math.sqrt(h);

const t1=
-b-s;

const t2=
-b+s;

if(t1>0)
return t1;

if(t2>0)
return t2;

return Infinity;

}


function rayWallDistance(
x,y,dx,dy
){

const left=40;
const right=W-40;
const top=40;
const bottom=H-40;

let t=Infinity;

if(dx<-.0001)
t=Math.min(
t,
(left-x)/dx
);

if(dx>.0001)
t=Math.min(
t,
(right-x)/dx
);

if(dy<-.0001)
t=Math.min(
t,
(top-y)/dy
);

if(dy>.0001)
t=Math.min(
t,
(bottom-y)/dy
);

return Math.max(0,t);

}


function buildHookBend(
sx,sy,ex,ey
){

const dx=ex-sx;
const dy=ey-sy;

const d=
Math.max(
1,
Math.hypot(dx,dy)
);

const bendStrength=
clamp(
38-d*.045,
5,
38
);

const count=12;

const result=[];

for(
let i=1;
i<count;
i++
){

const t=i/count;

const falloff=
Math.sin(
Math.PI*t
);

result.push({

t,

offset:
(Math.random()-.5)*
2*
bendStrength*
falloff,

wave:
.55+
Math.random()*1.45,

phase:
Math.random()*
Math.PI*2

});

}

return result;

}


function hookImpact(
x,y,kind
){

for(
let i=0;
i<18;
i++
){

const a=
Math.random()*
Math.PI*2;

const s=
80+
Math.random()*240;

state.particles.push({

x,y,

vx:
Math.cos(a)*s,

vy:
Math.sin(a)*s,

life:
.22+
Math.random()*.32,

size:
2+
Math.random()*3

});

}

state.flash=
kind==="player"
?.11
:.06;

}


function launchHook(
targetX,
targetY
){

if(
!state.running ||
state.hookCooldown>0 ||
state.p1.hp<=0
)
return;

const p=state.p1;

let dx=
targetX-p.x;

let dy=
targetY-p.y;

const d=
Math.max(
.001,
Math.hypot(dx,dy)
);

dx/=d;
dy/=d;

const wallT=
Math.min(
820,
rayWallDistance(
p.x,
p.y,
dx,
dy
)
);

const playerT=
rayCircleDistance(
p.x,
p.y,
dx,
dy,
state.p2.x,
state.p2.y,
state.p2.r+6
);

const hitPlayer=
playerT<=wallT &&
playerT<=820;

const hitT=
hitPlayer
?playerT
:wallT;

const ex=
p.x+dx*hitT;

const ey=
p.y+dy*hitT;

const pullDistance=
Math.max(
40,
Math.min(
820,
hitT
)
);

state.hookCooldown=2;

state.hook.active=true;

state.hook.mode=
hitPlayer
?"player"
:"wall";

state.hook.x=ex;
state.hook.y=ey;
state.hook.age=0;

state.hook.startX=p.x;
state.hook.startY=p.y;

state.hook.endX=ex;
state.hook.endY=ey;

state.hook.restLength=
pullDistance;

state.hook.bend=
buildHookBend(
p.x,
p.y,
ex,
ey
);

state.hook.power=
clamp(
.9+
Math.pow(
pullDistance/360,
1.2
),
1.05,
3.4
);

if(hitPlayer){

const t=state.p2;

const tx=
t.x-p.x;

const ty=
t.y-p.y;

const td=
Math.max(
.001,
Math.hypot(tx,ty)
);

const ux=tx/td;
const uy=ty/td;

const strength=
720*
state.hook.power;

p.hookVx=
ux*strength*.86;

p.hookVy=
uy*strength*.86;

t.hookVx=
-ux*strength*1.04;

t.hookVy=
-uy*strength*1.04;

state.hook.endX=t.x;
state.hook.endY=t.y;

hookImpact(
t.x,
t.y,
"player"
);

}else{

const strength=
570*
state.hook.power;

p.hookVx=
dx*strength;

p.hookVy=
dy*strength;

hookImpact(
ex,
ey,
"wall"
);

}

sendGameEvent({
type:"hook",
x:targetX,
y:targetY
});

}


function updateHook(dt){

state.hookCooldown=
Math.max(
0,
state.hookCooldown-dt
);

if(state.hook.active){

state.hook.age+=dt;

if(
state.hook.mode==="player"
){

state.hook.endX=
state.p2.x;

state.hook.endY=
state.p2.y;

const dx=
state.p2.x-state.p1.x;

const dy=
state.p2.y-state.p1.y;

const distance=
Math.max(
1,
Math.hypot(dx,dy)
);

const ux=dx/distance;
const uy=dy/distance;

const stretch=
Math.max(
0,
distance-
state.hook.restLength*.38
);

const spring=
Math.min(
1900,
stretch*
(
8.5+
state.hook.power*2.2
)
);

state.p1.hookVx+=
ux*spring*dt;

state.p1.hookVy+=
uy*spring*dt;

state.p2.hookVx-=
ux*spring*1.24*dt;

state.p2.hookVy-=
uy*spring*1.24*dt;

}else{

const dx=
state.hook.endX-
state.p1.x;

const dy=
state.hook.endY-
state.p1.y;

const distance=
Math.max(
1,
Math.hypot(dx,dy)
);

const ux=dx/distance;
const uy=dy/distance;

const stretch=
Math.max(
0,
distance-
state.hook.restLength*.28
);

const spring=
Math.min(
2200,
stretch*
(
10+
state.hook.power*2.6
)
);

state.p1.hookVx+=
ux*spring*dt;

state.p1.hookVy+=
uy*spring*dt;

}

if(
state.hook.age>=state.hook.life
)
state.hook.active=false;

}

state.p1.hookVx*=
Math.exp(-1.35*dt);

state.p1.hookVy*=
Math.exp(-1.35*dt);

state.p2.hookVx*=
Math.exp(-1.35*dt);

state.p2.hookVy*=
Math.exp(-1.35*dt);

if(
Math.hypot(
state.p1.hookVx,
state.p1.hookVy
)<5
){

state.p1.hookVx=0;
state.p1.hookVy=0;

}

if(
Math.hypot(
state.p2.hookVx,
state.p2.hookVy
)<5
){

state.p2.hookVx=0;
state.p2.hookVy=0;

}

}

targetY
){

return;

let dx=
targetX-shooter.x;

let dy=
targetY-shooter.y;

const d=
Math.max(
.001,
len(dx,dy)
);

dx/=d;
dy/=d;

shooter.dir=
dx>=0?1:-1;

shooter.cooldown=1;

shooter.recoil=.12;

state.bullets.push({

x:
shooter.x+dx*24,

y:
shooter.y+dy*24,

vx:
dx*510,

vy:
dy*510,

life:1.6,

owner:shooter

});

for(
let i=0;
i<5;
i++
){

state.particles.push({

shooter.x+dx*28,

y:
shooter.y+dy*28,

vx:
dx*(120+Math.random()*120)+
(Math.random()-.5)*70,

vy:
dy*(120+Math.random()*120)+
(Math.random()-.5)*70,

life:
.18+Math.random()*.16,

size:
2+Math.random()*2

});

});

amount

arenaBounds(state.p1);

);

function updateBot(dt){

const b=state.p2;
const p=state.p1;

b.cooldown=
Math.max(
0,
b.cooldown-dt
);

b.hurt=
Math.max(
0,
b.hurt-dt
);

b.recoil=
Math.max(
0,
b.recoil-dt
);

b.x+=b.hookVx*dt;
b.y+=b.hookVy*dt;

const dx=p.x-b.x;
const dy=p.y-b.y;

const d=
Math.max(
1,
len(dx,dy)
);

state.aiMoveClock-=dt;

if(
state.aiMoveClock<=0
){

state.aiMoveClock=
.7+Math.random()*.9;

state.aiStrafe*=-1;

}

const desired=
d>360
?1
:d<235
?-1
:0;

let mx=
dx/d*desired+
(-dy/d)*
state.aiStrafe*.72;

let my=
dy/d*desired+
(dx/d)*
state.aiStrafe*.72;

const ml=
len(mx,my)||1;

b.x+=
mx/ml*
b.speed*.72*
dt;

b.y+=
my/ml*
b.speed*.72*
dt;

arenaBounds(b);

state.aiFireClock-=dt;

if(
state.aiFireClock<=0 &&
d<620
){

state.aiFireClock=
.32+Math.random()*.38;

shoot(
b,
p.x+(Math.random()-.5)*20,
p.y+(Math.random()-.5)*20
);

}

}


function updateRemotePlayer(dt){

const b=state.p2;

b.cooldown=
Math.max(
0,
b.cooldown-dt
);

b.hurt=
Math.max(
0,
b.hurt-dt
);

b.recoil=
Math.max(
0,
b.recoil-dt
);

const rdx=
remoteInput.keys.includes("a")||
remoteInput.keys.includes("arrowleft")
?-1:
remoteInput.keys.includes("d")||
remoteInput.keys.includes("arrowright")
?1:0;

const rdy=
remoteInput.keys.includes("w")||
remoteInput.keys.includes("arrowup")
?-1:
remoteInput.keys.includes("s")||
remoteInput.keys.includes("arrowdown")
?1:0;

const d=
Math.hypot(rdx,rdy)||1;

b.x+=
rdx/d*
b.speed*
dt;

b.y+=
rdy/d*
b.speed*
dt;

b.x+=
b.hookVx*dt;

b.y+=
b.hookVy*dt;

arenaBounds(b);

if(remoteInput.shoot){

);

function updateBullets(dt){

for(
let i=state.bullets.length-1;
i>=0;
i--
){

const b=
state.bullets[i];

b.x+=b.vx*dt;
b.y+=b.vy*dt;

b.life-=dt;

if(
b.life<=0||
b.x<0||
b.y<0||
b.x>W||
b.y>H
){

state.bullets.splice(i,1);
continue;

}

const target=
b.owner===state.p1
?state.p2
:state.p1;

if(
dist(b,target)<=target.r+5
){

damage(
target,
25
);

state.bullets.splice(i,1);

}

}

}


function updateParticles(dt){

for(
let i=state.particles.length-1;
i>=0;
i--
){

const p=
state.particles[i];

p.x+=p.vx*dt;
p.y+=p.vy*dt;

p.vx*=.92;
p.vy*=.92;

p.life-=dt;

if(p.life<=0)
state.particles.splice(i,1);

}

}

);

let x=0;
x<=W;
x+=48
){

ctx.moveTo(x,0);
ctx.lineTo(x,H);
ctx.stroke();

}

for(
let y=0;
y<=H;
y+=48
){

ctx.moveTo(0,y);
ctx.lineTo(W,y);
ctx.stroke();

}

ctx.strokeStyle=
"rgba(145,165,195,.28)";

40,
40,
W-80,
H-80
);

"rgba(145,165,195,.14)";

ctx.lineTo(W/2,H-40);

ctx.stroke();

ctx.setLineDash([]);

ctx.fillStyle=
"rgba(145,165,195,.055)";

W/2,
H/2,
95,
0,
Math.PI*2
);

"rgba(145,165,195,.12)";

W/2,
H/2,
95,
0,
Math.PI*2
);

function drawPlayer(p){

p.y
);

(
p===state.p1
?mouse.y
:state.p1.y
)-p.y,
(
p===state.p1
?mouse.x
:state.p1.x
)-p.x
);

const recoil=
p.recoil>0
?-p.recoil*45
:0;

ctx.rotate(a);

ctx.fillStyle="#161c25";

10+recoil,
-4,

);

);

:p.color;

function drawHook(){

if(!state.hook.active)
return;

const h=state.hook;

const life=
clamp(
1-h.age/h.life,
0,
1
);

const dx=
h.endX-h.startX;

const dy=
h.endY-h.startY;

const d=
Math.max(
1,
Math.hypot(dx,dy)
);

const nx=-dy/d;
const ny=dx/d;

const sway=
Math.sin(h.age*8)*
Math.min(
4.5,
2.2+h.power*1.1
);

const points=[
{
x:h.startX,
y:h.startY
}
];

for(
const b of h.bend
){

const wave=
Math.sin(
h.age*(4+b.wave*2)+b.phase
)*
sway*
Math.sin(Math.PI*b.t);

points.push({

x:
h.startX+
dx*b.t+
nx*(b.offset+wave),

y:
h.startY+
dy*b.t+
ny*(b.offset+wave)

});

}

points.push({
x:h.endX,
y:h.endY
});

function traceRope(){

ctx.beginPath();

ctx.moveTo(
points[0].x,
points[0].y
);

for(
let i=1;
i<points.length-1;
i++
){

const current=points[i];
const next=points[i+1];

const midX=
(current.x+next.x)*.5;

const midY=
(current.y+next.y)*.5;

ctx.quadraticCurveTo(
current.x,
current.y,
midX,
midY
);

}

const last=
points[points.length-1];

const prev=
points[points.length-2];

ctx.quadraticCurveTo(
prev.x,
prev.y,
last.x,
last.y
);

}

ctx.save();

ctx.lineCap="round";
ctx.lineJoin="round";

ctx.globalAlpha=
life*.25;

ctx.strokeStyle="#b8c6dc";

ctx.lineWidth=8;

ctx.shadowColor="#a7bfe8";
ctx.shadowBlur=7;

traceRope();

ctx.stroke();

ctx.globalAlpha=life;

ctx.strokeStyle="#d8e1ed";

ctx.lineWidth=2.6;

ctx.shadowBlur=2;

traceRope();

ctx.stroke();

ctx.fillStyle="#f3f6fb";

ctx.shadowBlur=8;

ctx.beginPath();

ctx.arc(
h.endX,
h.endY,
5.5,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

}

const snapshot=
await get(
ref(
db,
"rooms/"+roomId+"/inputs/guest"
)
);

if(snapshot.exists()){

const value=
snapshot.val();

remoteInput.keys=
Array.isArray(value.keys)
?value.keys
:[];

remoteInput.mouseX=
Number(value.mouseX)||
W/2;

remoteInput.mouseY=
Number(value.mouseY)||
H/2;

remoteInput.shoot=
Boolean(value.shoot);

}

}catch(error){

console.error(error);

}

}


function backLobby(){

if(roomUnsubscribe){

roomUnsubscribe();

roomUnsubscribe=null;

}

if(roomId){

remove(
ref(
db,
"rooms/"+roomId
)
).catch(
()=>{}
);

}

roomId=null;
playerId=null;
roomActive=false;
isHost=false;
gameMode="bot";

overlay.classList.remove(
"show"
);

lobby.style.display="flex";

createdRoom.classList.add(
"hidden"
);

joinCode.value="";

lobbyStatus.textContent="";

}


window.addEventListener(
"keydown",
e=>{

const k=
e.key.toLowerCase();

if([
"w",
"a",
"s",
"d",
"arrowup",
"arrowdown",
"arrowleft",
"arrowright"
].includes(k)){

e.preventDefault();

}

keys.add(k);

}
);


window.addEventListener(
"keyup",
e=>{

keys.delete(
e.key.toLowerCase()
);

}
);


canvas.addEventListener(
"mousemove",
e=>{

const p=
canvasPoint(e);

mouse.x=p.x;
mouse.y=p.y;

}
);


canvas.addEventListener(
"mousedown",
e=>{

if(e.button===0){

mouse.down=true;

const p=
canvasPoint(e);

mouse.x=p.x;
mouse.y=p.y;

if(
gameMode!=="online"||
isHost
){

shoot(
state.p1,
mouse.x,
mouse.y
);

}

}

if(e.button===2){

e.preventDefault();

const p=
canvasPoint(e);

mouse.x=p.x;
mouse.y=p.y;

if(
gameMode!=="online"||
isHost
){

launchHook(
mouse.x,
mouse.y
);

}else{

sendGameEvent({
type:"hook",
x:mouse.x,
y:mouse.y
});

}

}

}
);


window.addEventListener(
"mouseup",
e=>{

if(e.button===0)
mouse.down=false;

}
);


canvas.addEventListener(
"mouseleave",
()=>{
mouse.down=false;
}
);


canvas.addEventListener(
"contextmenu",
e=>{
e.preventDefault();
}
);


createRoomBtn.addEventListener(
"click",
createRoom
);


joinRoomBtn.addEventListener(
"click",
joinRoom
);


joinCode.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
joinRoom();

}
);


copyCodeBtn.addEventListener(
"click",
async()=>{

if(!roomId)
return;

try{

await navigator.clipboard.writeText(
roomId
);

copyCodeBtn.textContent=
"COPIED";

setTimeout(
()=>{
copyCodeBtn.textContent=
"COPY";
},
1000
);

}catch{

}

}
);


playBotBtn.addEventListener(
"click",
()=>{

gameMode="bot";

isHost=false;

roomActive=true;

lobby.style.display="none";

enemyName.textContent=
"BOT";

reset();

}
);


restartBtn.addEventListener(
"click",
async()=>{

if(gameMode==="online"){

if(isHost){

round++;

reset();

await syncGameState();

}

}else{

round++;

reset();

}

}
);


backToLobby.addEventListener(
"click",
backLobby
);


const bonusOverlay=
document.createElement("div");

bonusOverlay.id=
"bonusOverlay";

bonusOverlay.style.display=
"none";

bonusOverlay.innerHTML=`

<div id="bonusPanel">

<h2 id="bonusTitle">
ВЫБЕРИ УСИЛИТЕЛЬ
</h2>

<div id="bonusSubtitle">
Время остановлено. Выбери один бонус.
</div>

<div id="bonusCards"></div>

</div>
`;

document.body.appendChild(
bonusOverlay
);


const bonusCards=
document.getElementById(
"bonusCards"
);


const bonusState={

nextTime:20,

paused:false,

damage:0,

fireCooldown:1,

bulletSpeed:510

};


const bonusPool=[

{

name:"Усиленный урон",

icon:"✦",

desc:"+10 урона каждой твоей пулей.",

apply:()=>{

bonusState.damage+=10;

}

},

{

name:"Быстрая стрельба",

icon:"⚡",

desc:"Кулдаун твоего пистолета уменьшается на 0.25 сек.",

apply:()=>{

bonusState.fireCooldown=
Math.max(
.25,
bonusState.fireCooldown-.25
);

}

},

{

name:"Скорость",

icon:"➤",

desc:"+30 к скорости движения.",

apply:()=>{

state.p1.speed+=30;

}

},

{

name:"Ремкомплект",

icon:"♥",

desc:"Восстанавливает 30 HP прямо сейчас.",

apply:()=>{

state.p1.hp=
Math.min(
100,
state.p1.hp+30
);

}

},

{

name:"Манёвренность",

icon:"◉",

desc:"Радиус игрока уменьшается на 3.",

apply:()=>{

state.p1.r=
Math.max(
11,
state.p1.r-3
);

}

},

{

name:"Мощный выстрел",

icon:"●",

desc:"+120 к скорости полёта твоих пуль.",

apply:()=>{

bonusState.bulletSpeed+=120;

}

}

];


function openBonusChoice(){

if(
!state.running||
bonusState.paused||
gameMode==="online"
)
return;

bonusState.paused=true;

state.running=false;

statusEl.textContent=
"CHOOSE BONUS";

bonusCards.innerHTML="";

const choices=
[...bonusPool]
.sort(
()=>Math.random()-.5
)
.slice(0,3);

choices.forEach(
bonus=>{

const card=
document.createElement("button");

card.className=
"bonusCard";

card.innerHTML=
'<div class="bonusIcon">'+
bonus.icon+
'</div>'+
'<div class="bonusName">'+
bonus.name+
'</div>'+
'<div class="bonusDesc">'+
bonus.desc+
'</div>';

card.addEventListener(
"click",
()=>{

bonus.apply();

bonusState.nextTime-=10;

bonusState.paused=false;

state.running=true;

statusEl.textContent=
"ROUND "+round;

bonusOverlay.style.display=
"none";

updateHud();

},
{once:true}
);

bonusCards.appendChild(
card
);

}
);

bonusOverlay.style.display=
"flex";

}


function updateBonuses(){

if(
gameMode==="online"||
!state.running||
bonusState.paused
)
return;

if(
state.time<=
bonusState.nextTime &&
bonusState.nextTime>0
){

openBonusChoice();

}

}


function resetBonuses(){

bonusState.nextTime=20;
bonusState.paused=false;
bonusState.damage=0;
bonusState.fireCooldown=1;
bonusState.bulletSpeed=510;

bonusOverlay.style.display=
"none";

}


function gameUpdate(dt){

if(!state)
return;

if(
gameMode==="online"&&
!isHost
){

updatePlayer(dt);

}else{

updatePlayer(dt);

if(gameMode==="bot")
updateBot(dt);
else
updateRemotePlayer(dt);

}

updateHook(dt);

updateBullets(dt);

updateParticles(dt);

state.flash=
Math.max(
0,
state.flash-dt
);

if(state.running){

state.time=
Math.max(
0,
state.time-dt
);

if(checkEnd())
return;

}

updateHud();

}


function frame(now){

const dt=
Math.min(
.033,
(now-last)/1000
);

last=now;

if(state){

if(
gameMode==="online"&&
isHost
){

readRemoteInput();

}

gameUpdate(dt);

if(
gameMode==="online"&&
isHost
){

sendingTimer+=dt;

if(sendingTimer>=.05){

sendingTimer=0;

syncGameState();

}

}else if(
gameMode==="online"&&
!isHost
){

sendingTimer+=dt;

if(sendingTimer>=.05){

sendingTimer=0;

sendInput();

}

}

updateBonuses();

render();

}

requestAnimationFrame(frame);

}


reset();

requestAnimationFrame(frame);

</script>

</body>
</html>
