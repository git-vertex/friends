<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 1v1</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08090d;
            color: white;
            font-family: Arial, sans-serif;
        }

        #menu {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #08090d;
            z-index: 10;
        }

        .panel {
            width: 360px;
            padding: 30px;
            background: #11131a;
            border: 1px solid #272b38;
            border-radius: 14px;
            box-shadow: 0 20px 80px rgba(0,0,0,.5);
        }

        h1 {
            margin: 0 0 25px;
            text-align: center;
            font-size: 28px;
        }

        input {
            width: 100%;
            height: 46px;
            margin-bottom: 10px;
            padding: 0 14px;
            border: 1px solid #303442;
            border-radius: 8px;
            outline: none;
            background: #0b0d12;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            height: 46px;
            margin-bottom: 10px;
            border: 0;
            border-radius: 8px;
            background: #5865f2;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #6975ff;
        }

        #status {
            min-height: 22px;
            margin-top: 10px;
            text-align: center;
            color: #9298a8;
            font-size: 14px;
        }

        #roomInfo {
            display: none;
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            padding: 10px 18px;
            background: rgba(10,12,18,.85);
            border: 1px solid #2d3240;
            border-radius: 9px;
            font-weight: bold;
        }

        #game {
            display: none;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            left: 20px;
            top: 20px;
            z-index: 5;
            pointer-events: none;
        }

        .hp {
            width: 220px;
            height: 18px;
            margin-bottom: 8px;
            overflow: hidden;
            border-radius: 5px;
            background: #252832;
            border: 1px solid #343946;
        }

        #hpFill {
            height: 100%;
            width: 100%;
            background: #43e06f;
            transition: width .1s linear;
        }

        #controls {
            color: #a5aaba;
            font-size: 13px;
        }

        #message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 5px 30px black;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="menu">
    <div class="panel">
        <h1>Firebase 1v1</h1>

        <input id="roomInput" maxlength="6" placeholder="ROOM CODE">

        <button id="createBtn">CREATE ROOM</button>
        <button id="joinBtn">JOIN ROOM</button>

        <div id="status"></div>
    </div>
</div>

<div id="roomInfo">
    ROOM: <span id="roomCode"></span>
</div>

<div id="game">
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div class="hp">
            <div id="hpFill"></div>
        </div>
        <div id="controls">
            WASD — move<br>
            LMB — attack
        </div>
    </div>

    <div id="message"></div>
</div>

<script type="module" src="./game.js"></script>

</body>
</html>
